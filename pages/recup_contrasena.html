<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterApp | Recuperar contraseña</title>

    <link rel="stylesheet" href="../CSS/style.css">

    <link rel="shortcut icon" type="image/png" href="../assets/images/logo.png">
</head>

<body>
    <!-- Recuperar contraseña -->
    <section class="container3" id="container">
        <section class="form-container sign-up-container">
            <form action="verificarCodigo.html">
                <h2>Recuperar Contraseña</h2>

                <section class="social-container">
                    <img src="../assets/images/logo.png" alt="Logo de InterApp">
                </section>

                <input type="text" name="usuario" id="usuario" placeholder="Usuario" autocomplete="username" required>
                <input type="email" name="correo" id="correo" placeholder="Correo Electrónico" autocomplete="email" required>

                <button type="submit">Recuperar con Código</button>
            </form>
        </section>
    </section>
</body>

</html>
