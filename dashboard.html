<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterApp</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Estilos propios (después de Bootstrap para poder sobrescribirlo) -->
    <link rel="stylesheet" href="CSS/style1.css">
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/logo.png">
</head>

<body>

    <section class="container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <section class="sidebar-header">
                <label for="sidebar-toggle" class="sidebar-toggle-btn">
                    <i class="fa-solid fa-bars"></i>
                </label>

                <section class="logo">
                    <a class="navbar-brand" href="dashboard.html"><img src="assets/images/logotipo%20blanco.png"
                            alt="logo" class="logo1"></a>
                </section>

                <a href="index.html" class="salir sidebar-mobile-logout">Cerrar Sesión</a>
            </section>

            <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-checkbox">

            <ul class="menu">

                <li class="active">
                    <i class="fa-solid fa-user"></i>
                    Mi perfil
                </li>

                <li>
                    <i class="fa-solid fa-box-open"></i>
                    Mis productos
                </li>

                <li>
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                    Intercambios
                </li>

            </ul>

            <section class="sidebar-footer">
                <a href="index.html" class="salir desktop-logout">Cerrar Sesión</a>
            </section>

        </aside>

        <!-- MAIN -->
        <main class="main-content">

            <!-- PERFIL -->
            <section class="profile-card">

                <section class="profile-left">

                    <img class="profile-img" src="assets/images/logo.png" alt="Foto de perfil">

                    <section class="profile-info">

                        <h2 id="perfil-nombre"></h2>

                        <p>
                            <i class="fa-solid fa-envelope-open-text"></i>
                            <span id="perfil-correo"></span>
                        </p>

                        <p>
                            <i class="fa-solid fa-mobile-screen-button"></i>
                            <span id="perfil-telefono"></span>
                        </p>

                    </section>

                </section>

                <section class="stats">

                    <section class="stat">
                        <i class="bi bi-box-seam-fill"></i>
                        <h3 id="total-productos">0</h3>
                        <p>Productos</p>
                    </section>

                </section>

            </section>

            <!-- PRODUCTOS -->
            <section class="products-section">

                <section class="section-title">
                    <h2>Mis productos</h2>
                    <button id="btn-agregar" type="button">Añadir productos</button>
                </section>

                <!-- FORMULARIO (oculto hasta que se da clic en "Añadir productos") -->
                <form id="form-producto" class="mb-4" hidden>
                    <label class="form-label" for="nombre">Nombre</label>
                    <input class="form-control mb-3" id="nombre" name="nombre" required>

                    <label class="form-label" for="busco">¿Qué buscas a cambio?</label>
                    <input class="form-control mb-3" id="busco" name="busco" placeholder="Ej: Bicicleta" required>

                    <label class="form-label" for="estado">Estado</label>
                    <select class="form-select mb-3" id="estado" name="estado">
                        <option>Disponible</option>
                        <option>Intercambio</option>
                    </select>

                    <button class="btn btn-dark" type="submit">Guardar producto</button>
                </form>

                <!-- Aquí productos-controller.js pinta mis productos -->
                <section class="products-grid" id="mis-productos"></section>

            </section>

        </main>
    </section>

    <!-- FOOTER -->
    <footer class="text-center">
        <p>
            2026 InterApp - Creado por
            <strong><a>Grupo de los Jueves</a></strong>
        </p>
    </footer>


    <script src="Js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="Js/auth-controller.js"></script>
    <script type="module" src="Js/productos-controller.js"></script>

</body>

</html>
