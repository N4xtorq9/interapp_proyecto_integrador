<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterApp | Iniciar Sesión</title>

    <!-- Estilos (carpeta CSS junto a este archivo) -->
    <link rel="stylesheet" href="CSS/style.css">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="shortcut icon" type="image/png" href="assets/images/logo.png">
</head>

<body>
    <!-- Login -->
    <section class="container1">
        <h2>Iniciar Sesión</h2>

        <form>
            <div class="social-container">
                <img src="assets/images/logo.png" alt="Logo de InterApp">
            </div>

            <div class="form-group">
                <label for="correo" class="sr-only">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    class="form-input"
                    placeholder="tu.correo@ejemplo.com"
                    autocomplete="email"
                    required
                >

                <label for="clave" class="sr-only">Contraseña</label>
                <input
                    type="password"
                    id="clave"
                    name="clave"
                    class="form-input"
                    placeholder="••••••••••••"
                    autocomplete="current-password"
                    required
                >
            </div>

            <a href="#" class="olvido">¿Olvidaste tu contraseña?</a>

            <button id="btn-login" type="button" class="btn btn-primary btn-block">
                Iniciar Sesión
            </button>

            <button id="btn-registro" type="button" class="btn btn-secondary btn-block">
                Registrarse
            </button>

            <span class="separador1">o inicia sesión con tu correo de Google</span>

            <!-- Botón Google -->
            <button type="button" class="google-btn">
                <i class="fa-brands fa-google"></i>
                Ingresa con Google
            </button>
        </form>
    </section>

    <script type="module" src="./Js/auth-controller.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
