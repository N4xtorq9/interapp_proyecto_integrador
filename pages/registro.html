<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | InterApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="auth-page">
  <a class="back-home" href="../index.html">← Volver al inicio</a>
  <main class="auth-layout">
    <section class="auth-aside"><a class="brand brand-white" href="../index.html" aria-label="InterApp"><img class="brand-logo brand-logo-white" src="../assets/interapp-logo-blanco.png" alt="InterApp Intercambio Fácil"></a><div><span class="eyebrow text-white-50">EMPIEZA A COMPARTIR</span><h1>Tu próximo gran hallazgo puede estar aquí.</h1><p>Únete a una comunidad donde todos tenemos algo para ofrecer.</p></div><div class="aside-decoration">🤝</div></section>
    <section class="auth-content"><div class="auth-form-wrap">
      <a class="auth-mobile-brand brand" href="../index.html" aria-label="InterApp"><img class="brand-logo" src="../assets/interapp-logo.png" alt="InterApp Intercambio Fácil"></a>
      <span class="eyebrow">CREA TU CUENTA</span><h2>¡Únete a InterApp!</h2><p class="muted">Completa tus datos para comenzar.</p>
      <form id="registerForm" novalidate>
        <div class="mb-3"><label class="form-label" for="name">Nombre completo</label><input class="form-control" id="name" type="text" placeholder="Tu nombre" required></div>
        <div class="mb-3"><label class="form-label" for="email">Correo electrónico</label><input class="form-control" id="email" type="email" placeholder="nombre@correo.com" required></div>
        <div class="mb-3"><label class="form-label" for="password">Contraseña</label><input class="form-control" id="password" type="password" minlength="6" placeholder="Mínimo 6 caracteres" required></div>
        <div class="mb-3"><label class="form-label" for="confirmPassword">Confirmar contraseña</label><input class="form-control" id="confirmPassword" type="password" placeholder="Repite tu contraseña" required></div>
        <button class="btn btn-primary btn-lg w-100 mt-2" type="submit">Crear mi cuenta</button>
      </form>
      <p class="auth-switch">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div></section>
  </main>
  <script type="module" src="../js/auth.js"></script>
</body>
</html>
