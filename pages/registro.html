<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterApp | Registro</title>

    <link rel="stylesheet" href="../CSS/style.css">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="shortcut icon" type="image/png" href="../assets/images/logo.png">
</head>

<body>
    <!-- Registro -->
    <section class="container-registro" id="container">
        <section class="form-container">
            <form action="autenticacion.html">
                <h2>Registro de Usuario</h2>

                <section class="social-container">
                    <img src="../assets/images/logo.png" alt="Logo de InterApp">
                </section>

                <input type="text" name="nombre" placeholder="Nombre" autocomplete="name" required>
                <input type="text" name="usuario" placeholder="Usuario" autocomplete="username" required>

                <label for="nacimiento" class="label-campo">Fecha de nacimiento</label>
                <input type="date" id="nacimiento" name="nacimiento" required>

                <input type="email" name="correo" placeholder="Correo Electrónico" autocomplete="email" required>
                <input type="email" name="correo2" placeholder="Confirmar Correo Electrónico" autocomplete="email" required>
                <input type="password" name="clave" placeholder="Contraseña" autocomplete="new-password" required>
                <input type="password" name="clave2" placeholder="Confirmar Contraseña" autocomplete="new-password" required>
                <input type="tel" name="celular" placeholder="Celular" autocomplete="tel" required>

                <button class="botones" type="submit">Crear Usuario</button>

                <span class="separador">o regístrate con tu correo de Google</span>

                <!-- Botón Google -->
                <button type="button" class="google-btn">
                    <i class="fa-brands fa-google"></i>
                    Registrarse con Google
                </button>
            </form>
        </section>
    </section>
</body>

</html>
