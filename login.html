<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/interapp_proyecto_integrador/Css/style.css">

    <!-- ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="shortcut icon" type="image/x-icon" href="/assets/images/logo.png">
    
    <title>InterApp</title>
</head>

<body>
    <!-- 3. Login -->
    <section class="container1">
        <h2>Iniciar Sesión</h2>

        <form>
            <section class="social-container">
                <img src="assets/images/logo.png" alt="" width="180">
            </section>

            <div class="form-group">
              <label for="correo" class="form-label">Correo Electrónico</label>
              <input 
                type="email" 
                id="correo" 
                name="correo" 
                class="form-input" 
                placeholder="tu.correo@ejemplo.com" 
                required
              >
            </div>

            <div class="form-group">
              <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.35rem;">
                <label for="clave" class="form-label" style="margin-bottom: 0;">Contraseña</label>
                <a href="#" style="font-size: 0.8rem; color: var(--color-text-muted); text-decoration: underline;">¿Olvidaste tu contraseña?</a>
              </div>
              <input 
                type="password" 
                id="clave" 
                name="clave" 
                class="form-input" 
                placeholder="••••••••••••" 
                required
              >
            </div>

            <button id="btn-login" type="button" class="btn btn-primary btn-block" style="padding: 0.9rem; margin-top: var(--space-sm);">
              Iniciar Sesión
            </button>
            <br>
            <button id="btn-login" type="button" class="btn btn-primary btn-block" style="padding: 0.9rem; margin-top: var(--space-sm);">
              Registrarse
            </button>

            <span class="separador1">o inicia sesión con tu correo</span>
            <!-- BOTÓN GOOGLE -->
            <button type="button" class="google-btn">
                <i class="fa-brands fa-google"></i>
                Ingresa con Google
            </button>
        </form>
    </section>
    <section>

    </section>

    <script type="module" src="./js/auth-controller.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
