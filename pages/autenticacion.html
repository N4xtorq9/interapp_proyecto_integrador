<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterApp | Autenticación</title>

    <link rel="stylesheet" href="../CSS/style.css">

    <link rel="shortcut icon" type="image/png" href="../assets/images/logo.png">
</head>

<body>
    <!-- Autenticación -->
    <section class="container2" id="container">
        <section class="form-container sign-up-container">
            <form action="verificarCodigo.html">
                <h2>Autenticación</h2>

                <section class="social-container">
                    <img src="../assets/images/logo.png" alt="Logo de InterApp">
                </section>

                <input type="email" name="correo" id="correo" placeholder="Correo Electrónico" autocomplete="email" required>
                <input type="tel" name="telefono" id="telefono" placeholder="Teléfono" autocomplete="tel" required>

                <button type="submit">Enviar Código</button>

                <section class="terminos-container">
                    <label for="condiciones" class="terminos-label">
                        <input type="checkbox" id="condiciones" name="condiciones" required>
                        <a href="#">Acepto los términos y condiciones</a>
                    </label>
                </section>
            </form>
        </section>
    </section>
</body>

</html>
