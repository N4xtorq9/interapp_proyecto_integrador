spring.application.name=interapp
server.port=8081

# Lee las credenciales desde el archivo .env (no se sube a GitHub)
spring.config.import=optional:file:.env[.properties]

# Conexion a Neon
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update

# Vaadin va bajo /app para no chocar con index.html
vaadin.url-mapping=/app/*
vaadin.launch-browser=false
