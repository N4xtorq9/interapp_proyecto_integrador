<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/interapp_proyecto_integrador/Css/style.css">

    <!-- ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/logo.png">
   
    <title>InterApp</title>
</head>

<body>

    <section class="container-registro" id="container">

        <section class="form-container">

            <form action="#">

                <h2>Registro de Usuario</h2>

                <section class="social-container">
                    <img src="assets/images/logo.png" alt="" width="180">
                </section>



                <input type="text" placeholder="Nombre" required>

                <input type="text" placeholder="Usuario" required>

                <input type="date" placeholder="Fecha Nacimiento" required>

                <input type="email" placeholder="Correo Electrónico" required>

                <input type="email" placeholder="Confirmar Correo Electrónico" required>

                <input type="password" placeholder="Contraseña" required>

                <input type="password" placeholder="Confirmar Contraseña" required>

                <input type="number" placeholder="Celular" required>

                <button class="botones" type="button" onclick="window.location.href='autenticacion.html'">

                    Crear Usuario

                </button>

                <br>
                <span class="separador">o regístrate con tu correo</span>
                <!-- BOTÓN GOOGLE -->
                <button type="button" class="google-btn">
                    <i class="fa-brands fa-google"></i>
                    Registrarse con Google
                </button>

            </form>

        </section>
    </section>

    <br>
    <br>
    <br>

</body>

</html>
